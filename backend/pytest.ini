[pytest]
asyncio_mode = auto
pythonpath = . scripts
testpaths = tests
asyncio_default_fixture_loop_scope = function
# Anirudh's router tests import `backend.app...` and need his routers/ package mounted in the app. Not integrated yet
# (see the D8 notes); remove these --ignore flags as each router is wired into app/main.py.
addopts = --ignore=tests/test_agent_api.py --ignore=tests/test_ops_api.py --ignore=tests/test_price_ingestion.py --ignore=tests/test_e2e_acceptance_and_chaos.py
