# backend/prompts.yaml
# IVR audio clip definitions for Annadata Dhwani
#
# FORMAT:
#   <clip_id>:
#     en: "<English source text — always present, source of truth>"
#     <lang_code>: "<translation — added by a native speaker for that language>"
#     reviewed: false
#
# LANGUAGE POLICY:
#   - Only English ("en") is stored here by default.
#   - Language-specific translations (e.g. "kn", "hi", "mr") must be added
#     by a native speaker of that language.  Do NOT put AI-generated or
#     transliterated text here — TTS will mispronounce it.
#   - The language used at runtime comes from the farmer's profile (set during
#     the LANG IVR state) and is supplied by Exotel.  This file does not
#     decide which languages exist; it only stores the text to synthesise.
#   - To add a new language: add a "<lang_code>: ..." line under the clips
#     you have translations for, then run:
#       python backend/scripts/prewarm_audio.py --langs <lang_code> \
#         --voices <lang_code>:<edge-tts-voice-name>
#
# RULES:
#   - Each line under 12 words where possible.
#   - Numbers written as words.
#   - "quintal" kept as "quintal" (farmers use it).
#   - Sentence fragments (you_entered, at_price, etc.) must sound natural
#     when followed by a spoken number.
#   - "press" = the common spoken verb for pressing a phone key.
#
# SPECIAL CLIPS:
#   lang_option  — key 1 selects Kannada, 2 Hindi, and 3 English.
#                  The prompt is played with explicit language overrides so
#                  callers hear the choices in Kannada, Hindi, and English.
#   qty_1..50    — "<n> quintal(s)" written as words.
#   d_0..d_9     — digit names (zero, one, two, …, nine).
#   cropkey_<crop>_<k> — "For <crop>, press <k>" for k=1,2,3.

# ---------------------------------------------------------------------------
# Core prompts
# ---------------------------------------------------------------------------
welcome:
  en: Welcome to Annadata Dhwani.
  kn: ಅನ್ನದಾತ ಧ್ವನಿಗೆ ಸ್ವಾಗತ.
  hi: अन्नदाता ध्वनि में आपका स्वागत है।
